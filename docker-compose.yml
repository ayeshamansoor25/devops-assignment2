# Part I - runs the app from the image pushed to Docker Hub
name: part1

services:
  db:
    image: postgres:16-alpine
    container_name: part1-db
    restart: always
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: NotesPass123
    volumes:
      - part1-db-data:/var/lib/postgresql/data   # persistent database volume
    ports:
      - "5433:5432"                               # host port differs from container port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ayesha025/notes-app:v1                 # image built from Dockerfile, pushed to Docker Hub
    container_name: part1-web
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: NotesPass123
      APP_TITLE: "Notes App - Part I (Docker Hub image)"
    ports:
      - "8000:5000"                               # host port differs from container port
    depends_on:
      db:
        condition: service_healthy

volumes:
  part1-db-data:
